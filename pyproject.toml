[project]
name = "pyrobridge-pipeline"
version = "0.1.0"
description = "Reproducible NASA MODIS / VIIRS observation and calibration pipeline"
requires-python = ">=3.12,<3.14"
dependencies = [
  "duckdb>=1.4,<2",
  "numpy>=2.2,<3",
  "pandas>=2.2,<3",
  "lightgbm>=4.6,<5",
  "scipy>=1.15,<2",
  "scikit-learn>=1.6,<2",
  "httpx>=0.28,<1",
  "h5py>=3.13,<4",
  "netCDF4>=1.7,<2",
  "pyhdf>=0.11,<1",
  "earthaccess>=0.19.0",
]

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
